<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jet Pilot Simulator</title>
  <style>
    :root {
      --bg: #070d16;
      --panel: rgba(11, 19, 32, 0.8);
      --panel-border: rgba(123, 168, 255, 0.22);
      --text: #e7eefb;
      --muted: #9db0cf;
      --accent: #48b8ff;
      --accent-2: #9a7dff;
      --danger: #ff5c73;
      --ok: #52e0a5;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at 20% 10%, #132b4a 0%, #070d16 40%, #050912 100%);
      color: var(--text);
    }

    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: 100vh;
      gap: 14px;
      padding: 14px;
    }

    .panel {
      padding: 18px;
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      background: linear-gradient(165deg, rgba(16, 26, 43, 0.9), rgba(10, 16, 28, 0.92));
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.38), inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
    }

    .eyebrow {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .title {
      margin: 0 0 16px;
      font-size: 22px;
      line-height: 1.25;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-card {
      border: 1px solid rgba(112, 161, 255, 0.2);
      background: rgba(22, 36, 58, 0.58);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
    }

    .status-row {
      border: 1px solid rgba(82, 224, 165, 0.3);
      background: rgba(17, 48, 40, 0.35);
      color: #cdfbe8;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .debrief-row {
      border: 1px solid rgba(113, 176, 255, 0.28);
      background: rgba(14, 24, 40, 0.55);
      color: #b8d4f0;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 12px;
      line-height: 1.5;
      min-height: 48px;
    }

    .controls-group {
      margin-top: 14px;
    }

    .controls-group h2 {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(122, 175, 255, 0.32);
      background: linear-gradient(180deg, rgba(37, 74, 129, 0.85), rgba(22, 44, 76, 0.92));
      color: var(--text);
      padding: 10px 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 100ms ease, border-color 100ms ease, box-shadow 100ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(135, 189, 255, 0.65);
      box-shadow: 0 8px 16px rgba(9, 21, 42, 0.4);
    }

    button.secondary {
      background: linear-gradient(180deg, rgba(49, 34, 95, 0.85), rgba(30, 20, 66, 0.92));
      border-color: rgba(171, 141, 255, 0.33);
    }

    .hint {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      border-top: 1px solid rgba(132, 163, 218, 0.18);
      padding-top: 12px;
    }

    .canvas-wrap {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--panel-border);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.42);
      min-height: calc(100vh - 28px);
      background: #081120;
    }

    #cockpitViewport,
    #hudCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #cockpitViewport { background: #081120; }
    #hudCanvas { pointer-events: none; z-index: 2; }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .canvas-wrap {
        min-height: 62vh;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="panel">
      <div class="eyebrow">Flight Ops Console</div>
      <h1 class="title">Jet Pilot Simulator</h1>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Cash</div>
          <div class="stat-value" id="cashValue">$0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Reputation</div>
          <div class="stat-value" id="reputationValue">0</div>
        </div>
      </div>

      <div class="status-row">
        Mission Status: <strong id="missionValue">Idle</strong>
      </div>

      <div class="debrief-row" id="missionDebrief">
        Start a training sortie when systems are online.
      </div>

      <div class="controls-group">
        <h2>Mission Control</h2>
        <div class="buttons">
          <button id="startMissionBtn">Start Training Sortie</button>
          <button class="secondary" id="pauseBtn">Pause / Resume</button>
          <button class="secondary" id="hudModeBtn">HUD Mode: Full</button>
        </div>
      </div>

      <div class="controls-group">
        <h2>Data</h2>
        <div class="buttons">
          <button class="secondary" id="saveBtn">Save Session</button>
          <button class="secondary" id="loadBtn">Load Session</button>
        </div>
      </div>

      <div class="hint">
        After boot: <strong>Enter</strong> or <strong>Start Training Sortie</strong>. Then <strong>W/S</strong> throttle, <strong>↑/↓</strong> pitch, <strong>G</strong> gear, <strong>Space</strong> pause.
      </div>
    </aside>
    <main class="canvas-wrap">
      <div id="cockpitViewport" aria-label="Cockpit first-person view"></div>
      <canvas id="hudCanvas"></canvas>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/state.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/simulation.js"></script>
  <script src="js/cockpit3d.js"></script>
  <script src="js/renderer-cockpit-hud.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ui-handlers.js"></script>
</body>
</html>
